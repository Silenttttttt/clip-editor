[project]
name = "video-editor"
version = "1.0.0"
description = "A browser-based, canvas-timeline non-linear video editor with an FFmpeg backend and a pluggable upload destination - pure Python stdlib, no pip dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
video-editor = "video_editor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_editor*"]
